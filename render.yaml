# Render Blueprint — https://render.com/docs/blueprint-spec
#
# GuardX is static files: no build step, no server, no environment variables.
# Deploying it is just "serve this directory".
#
# After merging to main, change `branch` below to main.

services:
  # The name must match the existing service exactly, so that a Blueprint
  # sync adopts it instead of creating a second, duplicate static site.
  - type: web
    name: Adaptive-Context-Aware-Code-API-Guardrails
    runtime: static
    branch: claude/jolly-noether-hrnp6s

    # Repo root. There is nothing to compile, so no buildCommand is set.
    staticPublishPath: .

    # No rewrite rules on purpose. Render's docs suggest a /* -> /index.html
    # rewrite for single-page apps; that would be wrong here. The console uses
    # hash routing (app.html#/overview), so every URL is a real file on disk,
    # and a catch-all would swallow /app.html and serve the landing page.

    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

      # The site is never framed by anything, and sets no permissions.
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), interest-cohort=()

      # Derived from what the pages actually load, not copied from a template:
      #   script-src 'self'    one external module (assets/js/app.js); no inline
      #                        <script>, no eval, no string timers
      #   style-src  'unsafe-inline'  required — the markup and the chart code
      #                        set style="..." attributes; there are no <style>
      #                        blocks, so this cannot be tightened without
      #                        rewriting those call sites
      #   img-src    data:     the <select> arrow is an inline SVG data URI
      #   font-src   'self'    IBM Plex is self-hosted; no third-party fonts
      #   connect-src 'self'   the page makes no network calls at runtime
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'"
